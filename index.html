<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090909"><meta name="color-scheme" content="dark"><meta name="description" content="NEXORA AI DRAMA — short dramas, one swipe away.">
<link rel="manifest" href="/manifest.webmanifest"><title>NEXORA AI DRAMA</title>
<style>
  #nexora-splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at 50% 42%,#28200c 0%,#100e09 38%,#070707 78%);color:#f8f1df;opacity:1;visibility:visible;transition:opacity .55s ease,visibility .55s ease}
  #nexora-splash.is-leaving{opacity:0;visibility:hidden;pointer-events:none}
  #nexora-splash .mark{width:88px;height:88px;display:grid;place-items:center;border:1px solid rgba(222,183,91,.75);border-radius:26px;background:linear-gradient(145deg,rgba(214,174,77,.2),rgba(80,57,18,.08));box-shadow:0 0 42px rgba(218,174,76,.2),inset 0 0 24px rgba(218,174,76,.08);animation:nexora-pulse 1.8s ease-in-out infinite}
  #nexora-splash .mark svg{width:38px;height:38px;fill:#e7c77e;filter:drop-shadow(0 0 9px rgba(231,199,126,.5));margin-left:4px}
  #nexora-splash .brand{font:800 30px/1.05 system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.16em;text-align:center;color:#f7edcf;text-shadow:0 2px 22px rgba(218,174,76,.22)}
  #nexora-splash .sub{margin-top:-9px;font:600 11px/1.4 system-ui,sans-serif;letter-spacing:.34em;color:#d8b96e}
  #nexora-splash .loading{position:absolute;bottom:max(54px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px;color:#a99a78;font:500 11px system-ui,sans-serif;letter-spacing:.12em}
  #nexora-splash .dots{display:flex;gap:7px}
  #nexora-splash .dots i{width:5px;height:5px;border-radius:50%;background:#d9b968;animation:nexora-dot 1s ease-in-out infinite}
  #nexora-splash .dots i:nth-child(2){animation-delay:.15s}#nexora-splash .dots i:nth-child(3){animation-delay:.3s}
  @keyframes nexora-pulse{50%{transform:scale(1.045);box-shadow:0 0 58px rgba(218,174,76,.3),inset 0 0 24px rgba(218,174,76,.12)}}
  @keyframes nexora-dot{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
  @media(prefers-reduced-motion:reduce){#nexora-splash .mark,#nexora-splash .dots i{animation:none}#nexora-splash{transition:none}}
</style>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-VYQZ6HT0RD"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  window.gtag = function(){window.dataLayer.push(arguments);};
</script>
</head>
<body>
<div id="nexora-splash" role="status" aria-label="NEXORA AI DRAMA is loading">
  <div class="mark" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M16 9.8c0-1.7 1.9-2.7 3.3-1.8l20 13.1a3.5 3.5 0 0 1 0 5.8l-20 13.1c-1.4.9-3.3-.1-3.3-1.8V9.8Z"/></svg></div>
  <div class="brand">NEXORA</div>
  <div class="sub">AI DRAMA</div>
  <div class="loading"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span>LOADING STORIES</span></div>
</div>
<div id="app"></div>
<script>
  window.setTimeout(function(){
    var splash=document.getElementById('nexora-splash');
    if(!splash)return;
    splash.classList.add('is-leaving');
    window.setTimeout(function(){splash.remove();},600);
  },2300);
</script>
<script type="module" src="/src.js"></script>
</body>
</html>
