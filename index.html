<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050609"><meta name="color-scheme" content="dark"><meta name="description" content="NEXORA AI DRAMA — short dramas, one swipe away.">
<link rel="manifest" href="/manifest.webmanifest"><title>NEXORA AI DRAMA</title>
<style>
  :root{color-scheme:dark}
  #nexora-splash{position:fixed;inset:0;z-index:99999;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;background:radial-gradient(ellipse at 50% 42%,rgba(72,54,27,.38) 0%,rgba(21,20,19,.45) 28%,transparent 58%),linear-gradient(145deg,#10131a 0%,#08090d 48%,#030405 100%);color:#f8f5ee;opacity:1;visibility:visible;transition:opacity .75s ease,visibility .75s ease}
  #nexora-splash:before{content:"";position:absolute;inset:-30%;pointer-events:none;background:linear-gradient(112deg,transparent 38%,rgba(235,202,137,.045) 48%,rgba(235,202,137,.13) 50%,rgba(235,202,137,.035) 53%,transparent 64%);transform:translateX(-48%) rotate(-8deg);animation:nexora-light 5.5s ease-in-out infinite}
  #nexora-splash:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 34%,rgba(0,0,0,.35) 100%),linear-gradient(0deg,rgba(0,0,0,.46),transparent 28%,transparent 72%,rgba(0,0,0,.22))}
  #nexora-splash.is-leaving{opacity:0;visibility:hidden;pointer-events:none}
  #nexora-splash .cinema{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;transform:translateY(-2vh);animation:nexora-arrive 1.1s cubic-bezier(.2,.8,.2,1) both}
  #nexora-splash .eyebrow{margin-bottom:27px;color:#b7a17a;font:600 9px/1.4 system-ui,sans-serif;letter-spacing:.48em;text-transform:uppercase;opacity:.9}
  #nexora-splash .mark{position:relative;width:82px;height:82px;display:grid;place-items:center;border:1px solid rgba(220,190,133,.7);border-radius:25px;background:linear-gradient(145deg,rgba(221,190,132,.17),rgba(255,255,255,.025));box-shadow:0 0 65px rgba(203,165,98,.15),inset 0 1px 0 rgba(255,255,255,.16),inset 0 -18px 30px rgba(0,0,0,.2);backdrop-filter:blur(8px);animation:nexora-breathe 3s ease-in-out infinite}
  #nexora-splash .mark:before{content:"";position:absolute;inset:7px;border:1px solid rgba(220,190,133,.17);border-radius:19px}
  #nexora-splash .mark svg{width:33px;height:33px;fill:#ead5aa;filter:drop-shadow(0 0 12px rgba(234,213,170,.42));margin-left:4px}
  #nexora-splash .brand{margin-top:29px;font:800 clamp(27px,8vw,35px)/1 system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.23em;text-indent:.23em;text-align:center;color:#f5f0e6;text-shadow:0 2px 28px rgba(221,190,132,.16)}
  #nexora-splash .sub{margin-top:13px;font:600 10px/1.4 system-ui,sans-serif;letter-spacing:.62em;text-indent:.62em;color:#d8bd8b}
  #nexora-splash .rule{width:42px;height:1px;margin-top:25px;background:linear-gradient(90deg,transparent,#c8a975,transparent);opacity:.8}
  #nexora-splash .tagline{margin-top:15px;color:rgba(231,222,204,.58);font:500 9px/1.5 system-ui,sans-serif;letter-spacing:.25em;text-transform:uppercase}
  #nexora-splash .loading{position:absolute;z-index:2;bottom:max(48px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:13px;color:rgba(220,207,184,.65);font:500 9px system-ui,sans-serif;letter-spacing:.28em}
  #nexora-splash .progress{width:94px;height:1px;overflow:hidden;background:rgba(220,190,133,.16)}
  #nexora-splash .progress i{display:block;width:35%;height:100%;background:#d7bd8b;box-shadow:0 0 9px rgba(215,189,139,.8);animation:nexora-progress 1.7s ease-in-out infinite}
  @keyframes nexora-breathe{0%,100%{transform:scale(1);box-shadow:0 0 45px rgba(203,165,98,.11),inset 0 1px 0 rgba(255,255,255,.16)}50%{transform:scale(1.035);box-shadow:0 0 72px rgba(203,165,98,.22),inset 0 1px 0 rgba(255,255,255,.2)}}
  @keyframes nexora-light{0%,100%{transform:translateX(-48%) rotate(-8deg);opacity:.25}50%{transform:translateX(48%) rotate(-8deg);opacity:1}}
  @keyframes nexora-arrive{from{opacity:0;transform:translateY(18px) scale(.97);filter:blur(7px)}to{opacity:1;transform:translateY(-2vh) scale(1);filter:blur(0)}}
  @keyframes nexora-progress{0%{transform:translateX(-120%)}100%{transform:translateX(390%)}}
  @media(prefers-reduced-motion:reduce){#nexora-splash:before,#nexora-splash .mark,#nexora-splash .cinema,#nexora-splash .progress i{animation:none}#nexora-splash{transition:none}}
</style>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-VYQZ6HT0RD"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  window.gtag = function(){window.dataLayer.push(arguments);};
</script>
</head>
<body>
<div id="nexora-splash" role="status" aria-label="NEXORA AI DRAMA is loading">
  <div class="cinema">
    <div class="eyebrow">A new world of stories</div>
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M16 9.8c0-1.7 1.9-2.7 3.3-1.8l20 13.1a3.5 3.5 0 0 1 0 5.8l-20 13.1c-1.4.9-3.3-.1-3.3-1.8V9.8Z"/></svg></div>
    <div class="brand">NEXORA</div>
    <div class="sub">AI DRAMA</div>
    <div class="rule"></div>
    <div class="tagline">Stories that move you</div>
  </div>
  <div class="loading"><div class="progress" aria-hidden="true"><i></i></div><span>ENTERING THE STORY</span></div>
</div>
<div id="app"></div>
<script>
  window.setTimeout(function(){
    var splash=document.getElementById('nexora-splash');
    if(!splash)return;
    splash.classList.add('is-leaving');
    window.setTimeout(function(){splash.remove();},800);
  },2800);
</script>
<script type="module" src="/src.js"></script>
</body>
</html>
