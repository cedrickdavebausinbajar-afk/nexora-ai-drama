name: Validate NEXORA AI DRAMA premium integration

on:
  pull_request:
    branches: [main]
    paths:
      - "src.js"
      - "ad-monetization.js"
      - "story-mode.js"
      - "premium-subscriptions.js"
      - "style.css"
      - "package.json"
      - "docs/**"
      - ".env.example"
      - "supabase/**"
      - ".github/workflows/build-android.yml"
      - ".github/workflows/validate-premium-subscriptions.yml"
  push:
    branches: [main, feat/premium-subscription-foundation]
    paths:
      - "src.js"
      - "ad-monetization.js"
      - "story-mode.js"
      - "premium-subscriptions.js"
      - "style.css"
      - "package.json"
      - "docs/**"
      - ".env.example"
      - "supabase/**"
      - ".github/workflows/build-android.yml"
      - ".github/workflows/validate-premium-subscriptions.yml"

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Run runtime resilience tests
        run: npm test
      - name: Build web app
        run: npm run build

  edge-function-types:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install npm dependencies for Deno's npm resolver
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts --no-audit --no-fund; else npm install --ignore-scripts --no-audit --no-fund; fi
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check subscription Edge Functions
        run: |
          deno check supabase/functions/paymongo-subscription-checkout/index.ts
          deno check supabase/functions/paymongo-webhook/index.ts
          deno check supabase/functions/premium-video-url/index.ts
          deno check supabase/functions/create-rewarded-unlock/index.ts
          deno check supabase/functions/admob-rewarded-ssv/index.ts
