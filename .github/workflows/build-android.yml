name: Build NEXORA AI DRAMA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses and install packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install web dependencies
        run: npm install

      - name: Write web app version metadata
        run: |
          node -e "const fs=require('fs'); const n=process.env.GITHUB_RUN_NUMBER; fs.writeFileSync('public/app-version.json', JSON.stringify({versionName:'1.0.'+n,versionCode:Number(n)}));"

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add private APK updater bridge
        run: |
          from pathlib import Path
          base = Path("android/app/src/main")
          java = base / "java/com/nexora/aidrama"
          java.mkdir(parents=True, exist_ok=True)
          (java / "ApkInstallerPlugin.java").write_text("""package com.nexora.aidrama;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          @CapacitorPlugin(name = "ApkInstaller")
          public class ApkInstallerPlugin extends Plugin {
            @PluginMethod
            public void install(PluginCall call) {
              String path = call.getString("filePath");
              if (path == null || path.isEmpty()) { call.reject("APK path is missing"); return; }
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && !getContext().getPackageManager().canRequestPackageInstalls()) {
                Intent settings = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + getContext().getPackageName()));
                getActivity().startActivity(settings);
                JSObject result = new JSObject(); result.put("needsPermission", true); call.resolve(result); return;
              }
              try {
                String clean = path.startsWith("file://") ? Uri.parse(path).getPath() : path;
                File apk = new File(clean);
                if (!apk.exists() || !apk.isFile() || apk.length() < 100000) { call.reject("Downloaded APK is missing or incomplete"); return; }
                Uri uri = FileProvider.getUriForFile(getContext(), getContext().getPackageName() + ".fileprovider", apk);
                Intent intent = new Intent(Intent.ACTION_VIEW);
                intent.setDataAndType(uri, "application/vnd.android.package-archive");
                intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                getActivity().startActivity(intent);
                JSObject result = new JSObject(); result.put("needsPermission", false); call.resolve(result);
              } catch (Exception e) { call.reject("Could not open Android package installer", e); }
            }
          }
          """)
          main = java / "MainActivity.java"
          main.write_text("""package com.nexora.aidrama;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(ApkInstallerPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          """)
          manifest = base / "AndroidManifest.xml"
          text = manifest.read_text()
          if "REQUEST_INSTALL_PACKAGES" not in text:
              text = text.replace("<application", '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />' + chr(10) + '    <application', 1)
          provider = '<provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/nexora_file_paths" /></provider>'
          if "nexora_file_paths" not in text:
              text = text.replace("</application>", provider + "</application>")
          manifest.write_text(text)
          xml = base / "res/xml"
          xml.mkdir(parents=True, exist_ok=True)
          (xml / "nexora_file_paths.xml").write_text('<?xml version="1.0" encoding="utf-8"?><paths xmlns:android="http://schemas.android.com/apk/res/android"><cache-path name="nexora_update_cache" path="." /></paths>')
          

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Set Android app version from build number
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re
          p = Path("android/app/build.gradle")
          data = p.read_text()
          code = os.environ["GITHUB_RUN_NUMBER"]
          data, a = re.subn(r"versionCode\s+\d+", f"versionCode {code}", data, count=1)
          data, b = re.subn(r"versionName\s+.*", f"versionName '1.0.{code}'", data, count=1)
          if a != 1 or b != 1:
              raise SystemExit("Could not set Android version fields safely")
          p.write_text(data)
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare and build signed release APK when signing secrets are configured
        continue-on-error: true
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Release signing secrets are not configured yet; debug APK is still built."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-key.jks
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$PWD/release-key.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          rm -f release-key.jks

      - name: Prepare stable APK download
        if: ${{ success() && hashFiles('android/app/build/outputs/apk/release/app-release.apk') != '' }}
        run: cp android/app/build/outputs/apk/release/app-release.apk NEXORA-AI-DRAMA.apk

      - name: Publish official app release for in-app updates
        if: ${{ success() && hashFiles('NEXORA-AI-DRAMA.apk') != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NEXORA AI DRAMA v1.0.${{ github.run_number }}
          body: |
            Official NEXORA AI DRAMA Android update.
            Version code: ${{ github.run_number }}
            Install over your existing NEXORA AI DRAMA app. Android will ask you to confirm.
          files: NEXORA-AI-DRAMA.apk
          make_latest: true

      - name: Upload signed release APK
        if: ${{ success() && hashFiles('android/app/build/outputs/apk/release/app-release.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-AI-DRAMA-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-AI-DRAMA-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
