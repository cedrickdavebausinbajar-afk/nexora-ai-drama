name: Build NEXORA AI DRAMA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nexora-ai-drama-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses and install packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies
        run: npm install

      - name: Write web app version metadata
        run: |
          node -e "const fs=require('fs'); const n=process.env.GITHUB_RUN_NUMBER; fs.writeFileSync('public/app-version.json', JSON.stringify({versionName:'1.0.'+n,versionCode:Number(n)}));"

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android 16 target for Google Play
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files = [Path('android/variables.gradle'), Path('android/build.gradle'), Path('android/app/build.gradle')]
          changed = []
          for path in files:
              if not path.exists():
                  continue
              data = path.read_text(encoding='utf-8')
              updated = re.sub(r'(?m)(compileSdkVersion\s*[=:]\s*)\d+', r'\g<1>36', data)
              updated = re.sub(r'(?m)(targetSdkVersion\s*[=:]\s*)\d+', r'\g<1>36', updated)
              if updated != data:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          if not changed:
              raise SystemExit('Could not find generated Android SDK version fields; refusing to build with an unverified target SDK.')
          print('Configured Android API 36 in:', ', '.join(changed))
          PY

      - name: Generate premium NEXORA launcher icons
        run: |
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          from PIL import Image
          import io

          svg = Path("public/nexora-logo.svg").read_bytes()
          res = Path("android/app/src/main/res")
          sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          for density, size in sizes.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              png = cairosvg.svg2png(bytestring=svg, output_width=size, output_height=size)
              image = Image.open(io.BytesIO(png)).convert("RGBA")
              image.save(folder / "ic_launcher.png")
              image.save(folder / "ic_launcher_round.png")
              foreground = cairosvg.svg2png(bytestring=svg, output_width=size, output_height=size)
              Image.open(io.BytesIO(foreground)).convert("RGBA").save(folder / "ic_launcher_foreground.png")

          adaptive = res / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)
          (adaptive / "ic_launcher.xml").write_text('''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/nexora_icon_background" />
            <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>''', encoding="utf-8")
          (adaptive / "ic_launcher_round.xml").write_text('''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/nexora_icon_background" />
            <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>''', encoding="utf-8")
          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)
          colors = values / "nexora_icon_colors.xml"
          colors.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources><color name="nexora_icon_background">#08050E</color></resources>''', encoding="utf-8")
          PY

      - name: Configure Android background notification checks
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, json

          gradle = Path("android/app/build.gradle")
          data = gradle.read_text()
          if "androidx.work:work-runtime" not in data:
              data = data.replace("dependencies {", 'dependencies {
    implementation "androidx.work:work-runtime:2.10.0"', 1)
          gradle.write_text(data)

          base = Path("android/app/src/main")
          java = base / "java/com/nexora/aidrama"
          java.mkdir(parents=True, exist_ok=True)
          supabase_url = json.dumps(os.environ.get("SUPABASE_URL", "").rstrip("/"))
          supabase_key = json.dumps(os.environ.get("SUPABASE_ANON_KEY", ""))
          worker = r"""package com.nexora.aidrama;
          import android.Manifest;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import androidx.core.app.NotificationCompat;
          import androidx.core.app.NotificationManagerCompat;
          import androidx.core.content.ContextCompat;
          import androidx.work.Worker;
          import androidx.work.WorkerParameters;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class NexoraNotificationWorker extends Worker {
            private static final String SUPABASE_URL = __SUPABASE_URL__;
            private static final String SUPABASE_KEY = __SUPABASE_KEY__;
            private static final String REPO = "cedrickdavebausinbajar-afk/nexora-ai-drama";
            public NexoraNotificationWorker(Context context, WorkerParameters params) { super(context, params); }
            @Override public Result doWork() {
              Context context = getApplicationContext();
              createChannels(context);
              if (Build.VERSION.SDK_INT >= 33 && ContextCompat.checkSelfPermission(context, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) return Result.success();
              checkLatestAppVersion(context);
              checkNewDramas(context);
              return Result.success();
            }
            private void createChannels(Context context) {
              if (Build.VERSION.SDK_INT >= 26) {
                NotificationManager manager = context.getSystemService(NotificationManager.class);
                manager.createNotificationChannel(new NotificationChannel("nexora-updates", "NEXORA Updates", NotificationManager.IMPORTANCE_DEFAULT));
                manager.createNotificationChannel(new NotificationChannel("nexora-watch", "Continue Watching", NotificationManager.IMPORTANCE_DEFAULT));
              }
            }
            private String get(String address, boolean supabase) throws Exception {
              HttpURLConnection connection = (HttpURLConnection)new URL(address).openConnection();
              connection.setRequestMethod("GET"); connection.setConnectTimeout(10000); connection.setReadTimeout(10000);
              connection.setRequestProperty("Accept", "application/json");
              connection.setRequestProperty("User-Agent", "NEXORA-AI-DRAMA-Android");
              if (supabase && !SUPABASE_KEY.isEmpty()) {
                connection.setRequestProperty("apikey", SUPABASE_KEY);
                connection.setRequestProperty("Authorization", "Bearer " + SUPABASE_KEY);
              }
              int status = connection.getResponseCode();
              InputStream stream = status >= 200 && status < 300 ? connection.getInputStream() : connection.getErrorStream();
              BufferedReader reader = new BufferedReader(new InputStreamReader(stream, StandardCharsets.UTF_8));
              StringBuilder result = new StringBuilder(); String line;
              while ((line = reader.readLine()) != null) result.append(line);
              reader.close(); connection.disconnect();
              if (status < 200 || status >= 300) throw new Exception("HTTP " + status);
              return result.toString();
            }
            private boolean notify(Context context, int id, String title, String body, String channel) {
              if (Build.VERSION.SDK_INT >= 33 && ContextCompat.checkSelfPermission(context, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) return false;
              Intent intent = new Intent(context, MainActivity.class);
              intent.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
              PendingIntent pending = PendingIntent.getActivity(context, id, intent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              NotificationCompat.Builder builder = new NotificationCompat.Builder(context, channel)
                .setSmallIcon(R.mipmap.ic_launcher).setContentTitle(title).setContentText(body)
                .setStyle(new NotificationCompat.BigTextStyle().bigText(body)).setAutoCancel(true)
                .setPriority(NotificationCompat.PRIORITY_DEFAULT).setContentIntent(pending);
              try { NotificationManagerCompat.from(context).notify(id, builder.build()); return true; }
              catch (SecurityException ignored) { return false; }
            }
            private void checkLatestAppVersion(Context context) {
              try {
                JSONObject release = new JSONObject(get("https://api.github.com/repos/" + REPO + "/releases/latest", false));
                String tag = release.optString("tag_name", "");
                Matcher matcher = Pattern.compile("^v\\d+\\.\\d+\\.(\\d+)$").matcher(tag);
                if (!matcher.matches()) return;
                long latest = Long.parseLong(matcher.group(1));
                PackageInfo info = context.getPackageManager().getPackageInfo(context.getPackageName(), 0);
                long installed = Build.VERSION.SDK_INT >= 28 ? info.getLongVersionCode() : info.versionCode;
                String previous = context.getSharedPreferences("nexora_notifications", 0).getString("notified_release", "");
                if (latest > installed && !tag.equals(previous)) {
                  JSONArray assets = release.optJSONArray("assets");
                  boolean hasApk = false;
                  if (assets != null) for (int i=0;i<assets.length();i++) if ("NEXORA-AI-DRAMA.apk".equals(assets.getJSONObject(i).optString("name"))) hasApk = true;
                  if (hasApk) {
                    if (notify(context, 8102, "NEXORA AI DRAMA update available", "Version " + tag + " is ready. Tap to open NEXORA and update.", "nexora-updates")) {
                      context.getSharedPreferences("nexora_notifications", 0).edit().putString("notified_release", tag).apply();
                    }
                  }
                }
              } catch (Exception ignored) {}
            }
            private void checkNewDramas(Context context) {
              if (SUPABASE_URL.isEmpty() || SUPABASE_KEY.isEmpty()) return;
              try {
                String endpoint = SUPABASE_URL + "/rest/v1/dramas?select=id,title,episode,created_at&published=eq.true&order=created_at.desc&limit=10";
                JSONArray rows = new JSONArray(get(endpoint, true));
                if (rows.length() == 0) return;
                String newest = rows.getJSONObject(0).optString("created_at", "");
                android.content.SharedPreferences prefs = context.getSharedPreferences("nexora_notifications", 0);
                String previous = prefs.getString("last_drama_created_at", null);
                if (previous == null) { prefs.edit().putString("last_drama_created_at", newest).apply(); return; }
                int fresh = 0; String firstTitle = ""; String firstEpisode = "";
                for (int i=0;i<rows.length();i++) {
                  JSONObject row = rows.getJSONObject(i);
                  String created = row.optString("created_at", "");
                  if (!created.isEmpty() && created.compareTo(previous) > 0) {
                    fresh++;
                    if (firstTitle.isEmpty()) { firstTitle=row.optString("title","New drama"); firstEpisode=row.optString("episode","New episode"); }
                  }
                }
                if (fresh > 0) {
                  String body = fresh == 1 ? firstTitle + " · " + firstEpisode : fresh + " new dramas or episodes are available.";
                  if (notify(context, 8101, fresh == 1 ? "New drama on NEXORA" : "New dramas on NEXORA", body, "nexora-updates")) {
                    prefs.edit().putString("last_drama_created_at", newest).apply();
                  }
                }
              } catch (Exception ignored) {}
            }
          }
          """
          worker = worker.replace("__SUPABASE_URL__", supabase_url).replace("__SUPABASE_KEY__", supabase_key)
          (java / "NexoraNotificationWorker.java").write_text(worker, encoding="utf-8")

          activity_path = java / "MainActivity.java"
          activity = activity_path.read_text(encoding="utf-8")
          if "NexoraNotificationWorker" not in activity:
              activity = activity.replace("import com.getcapacitor.BridgeActivity;", """import com.getcapacitor.BridgeActivity;
          import androidx.work.ExistingPeriodicWorkPolicy;
          import androidx.work.PeriodicWorkRequest;
          import androidx.work.WorkManager;
          import androidx.work.Constraints;
          import androidx.work.NetworkType;
          import java.util.concurrent.TimeUnit;""")
              activity = activity.replace("super.onCreate(savedInstanceState);", """super.onCreate(savedInstanceState);
              Constraints constraints = new Constraints.Builder().setRequiredNetworkType(NetworkType.CONNECTED).build();
              PeriodicWorkRequest request = new PeriodicWorkRequest.Builder(NexoraNotificationWorker.class, 15, TimeUnit.MINUTES).setConstraints(constraints).build();
              WorkManager.getInstance(this).enqueueUniquePeriodicWork("nexora-background-notifications", ExistingPeriodicWorkPolicy.KEEP, request);""")
              activity_path.write_text(activity, encoding="utf-8")

          manifest = base / "AndroidManifest.xml"
          manifest_text = manifest.read_text(encoding="utf-8")
          permission = '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          if permission not in manifest_text:
              manifest_text = manifest_text.replace("<application", permission + chr(10) + "    <application", 1)
          manifest.write_text(manifest_text, encoding="utf-8")
          PY

      - name: Configure native APK download and Android installer
        run: |
          python - <<'PY'
          from pathlib import Path
          base = Path("android/app/src/main")
          java = base / "java/com/nexora/aidrama"
          java.mkdir(parents=True, exist_ok=True)
          plugin = r"""package com.nexora.aidrama;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import androidx.core.content.FileProvider;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          @CapacitorPlugin(name = "ApkInstaller")
          public class ApkInstallerPlugin extends Plugin {
            private final ExecutorService executor = Executors.newSingleThreadExecutor();
            @PluginMethod
            public void downloadAndInstall(PluginCall call) {
              String address = call.getString("url");
              if (address == null || !address.startsWith("https://")) {
                call.reject("A secure HTTPS APK URL is required."); return;
              }
              if (Build.VERSION.SDK_INT >= 26 && !getContext().getPackageManager().canRequestPackageInstalls()) {
                Intent settings = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                  Uri.parse("package:" + getContext().getPackageName()));
                getActivity().startActivity(settings);
                JSObjectCompat.resolvePermission(call);
                return;
              }
              executor.execute(() -> {
                HttpURLConnection connection = null;
                try {
                  File folder = new File(getContext().getCacheDir(), "updates");
                  if (!folder.exists() && !folder.mkdirs()) throw new Exception("Could not create update folder.");
                  File apk = new File(folder, "NEXORA-AI-DRAMA.apk");
                  connection = (HttpURLConnection)new URL(address).openConnection();
                  connection.setInstanceFollowRedirects(true);
                  connection.setConnectTimeout(20000); connection.setReadTimeout(30000);
                  connection.setRequestProperty("User-Agent", "NEXORA-AI-DRAMA-Android");
                  int status = connection.getResponseCode();
                  if (status < 200 || status >= 300) throw new Exception("APK server returned HTTP " + status + ".");
                  long length = connection.getContentLengthLong();
                  if (length > 600L * 1024L * 1024L) throw new Exception("APK is larger than the allowed download size.");
                  try (InputStream in = connection.getInputStream(); FileOutputStream out = new FileOutputStream(apk)) {
                    byte[] buffer = new byte[65536]; int count; long total = 0;
                    while ((count = in.read(buffer)) != -1) {
                      total += count;
                      if (total > 600L * 1024L * 1024L) throw new Exception("APK exceeded the allowed download size.");
                      out.write(buffer, 0, count);
                    }
                    out.getFD().sync();
                  }
                  if (!apk.isFile() || apk.length() < 4) throw new Exception("Downloaded APK is empty.");
                  try (InputStream check = new java.io.FileInputStream(apk)) {
                    if (check.read() != 0x50 || check.read() != 0x4b) throw new Exception("The server did not return a valid APK file.");
                  }
                  Uri uri = FileProvider.getUriForFile(getContext(),
                    getContext().getPackageName() + ".fileprovider", apk);
                  Intent install = new Intent(Intent.ACTION_VIEW);
                  install.setDataAndType(uri, "application/vnd.android.package-archive");
                  install.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                  if (install.resolveActivity(getContext().getPackageManager()) == null)
                    throw new Exception("No Android package installer is available on this device.");
                  getContext().startActivity(install);
                  com.getcapacitor.JSObject result = new com.getcapacitor.JSObject();
                  result.put("started", true);
                  call.resolve(result);
                } catch (Exception error) {
                  call.reject("APK download/install failed: " + error.getMessage(), error);
                } finally {
                  if (connection != null) connection.disconnect();
                }
              });
            }
            private static class JSObjectCompat {
              static void resolvePermission(PluginCall call) {
                com.getcapacitor.JSObject result = new com.getcapacitor.JSObject();
                result.put("requiresPermission", true);
                call.resolve(result);
              }
            }
          }
          """
          (java / "ApkInstallerPlugin.java").write_text(plugin, encoding="utf-8")
          activity_path = java / "MainActivity.java"
          activity = activity_path.read_text(encoding="utf-8")
          if "ApkInstallerPlugin.class" not in activity:
              activity = activity.replace("import com.getcapacitor.BridgeActivity;", "import com.getcapacitor.BridgeActivity;
import com.nexora.aidrama.ApkInstallerPlugin;")
              activity = activity.replace("super.onCreate(savedInstanceState);", "registerPlugin(ApkInstallerPlugin.class);
        super.onCreate(savedInstanceState);", 1)
              activity_path.write_text(activity, encoding="utf-8")
          manifest = base / "AndroidManifest.xml"
          xml = manifest.read_text(encoding="utf-8")
          permission = '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'
          if permission not in xml:
              xml = xml.replace("<application", permission + "
    <application", 1)
          provider = '''        <provider
                  android:name="androidx.core.content.FileProvider"
                  android:authorities="${applicationId}.fileprovider"
                  android:exported="false"
                  android:grantUriPermissions="true">
                  <meta-data
                      android:name="android.support.FILE_PROVIDER_PATHS"
                      android:resource="@xml/nexora_file_paths" />
              </provider>
          '''
          if "androidx.core.content.FileProvider" not in xml:
              xml = xml.replace("</application>", provider + "    </application>")
          manifest.write_text(xml, encoding="utf-8")
          paths = base / "res/xml/nexora_file_paths.xml"
          paths.parent.mkdir(parents=True, exist_ok=True)
          paths.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="nexora_updates" path="updates/" />
          </paths>''', encoding="utf-8")
          PY

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Set Android app version from build number
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re
          p = Path("android/app/build.gradle")
          data = p.read_text()
          code = os.environ["GITHUB_RUN_NUMBER"]
          data, a = re.subn(r"versionCode\s+\d+", f"versionCode {code}", data, count=1)
          data, b = re.subn(r"versionName\s+.*", f"versionName '1.0.{code}'", data, count=1)
          if a != 1 or b != 1:
              raise SystemExit("Could not set Android version fields safely")
          p.write_text(data)
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare and build signed release APK and Play Store AAB
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Release signing secrets are not configured yet; debug APK is still built."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-key.jks
          cd android
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$PWD/release-key.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          rm -f release-key.jks

      - name: Prepare stable APK download
        if: ${{ success() && hashFiles('android/app/build/outputs/apk/release/app-release.apk') != '' }}
        run: cp android/app/build/outputs/apk/release/app-release.apk NEXORA-AI-DRAMA.apk

      - name: Publish official app release for in-app updates
        if: ${{ success() && hashFiles('NEXORA-AI-DRAMA.apk') != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NEXORA AI DRAMA v1.0.${{ github.run_number }}
          body: |
            Official NEXORA AI DRAMA Android update.
            Version code: ${{ github.run_number }}
            Install over your existing NEXORA AI DRAMA app. Android will ask you to confirm.
          files: |
            NEXORA-AI-DRAMA.apk
            NEXORA-AI-DRAMA.aab
          make_latest: true


      - name: Prepare Google Play App Bundle
        if: ${{ success() && hashFiles('android/app/build/outputs/bundle/release/app-release.aab') != '' }}
        run: cp android/app/build/outputs/bundle/release/app-release.aab NEXORA-AI-DRAMA.aab

      - name: Upload signed Google Play App Bundle
        if: ${{ success() && hashFiles('NEXORA-AI-DRAMA.aab') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-AI-DRAMA-play-store-aab
          path: NEXORA-AI-DRAMA.aab
          if-no-files-found: error
          retention-days: 90

      - name: Upload signed release APK
        if: ${{ success() && hashFiles('android/app/build/outputs/apk/release/app-release.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-AI-DRAMA-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-AI-DRAMA-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
