name: Temporary Story Reader APK Test

on:
  push:
    branches:
      - test/story-reader
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install web dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Create Android wrapper if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
      - name: Sync Capacitor Android project
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-AI-DRAMA-story-reader-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
